name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (例如 v1.0)'
        required: false
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Standalone Exe & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
              $tag = "${{ github.event.inputs.tag_name }}"
              if (-not $tag) { $tag = "v1.0" }
          }
          Write-Host "Target Tag: $tag"
          echo "TAG_NAME=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Standalone Executable with PyInstaller
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
          RELEASE_TAG: ${{ steps.get_tag.outputs.TAG_NAME }}
        run: |
          chcp 65001 >nul
          python build_exe.py

      - name: Package Release Assets & Compute Checksum
        shell: pwsh
        run: |
          $tag = "${{ steps.get_tag.outputs.TAG_NAME }}"
          New-Item -ItemType Directory -Path "release_pkg" -Force

          $srcExe = "dist/Teams會議錄音與轉文字.exe"
          if (-not (Test-Path $srcExe)) {
              Write-Error "Executable not found at $srcExe"
              exit 1
          }

          # 提供 ASCII 英文標準名稱（避免 GitHub Release Asset URL 編碼截斷）與中文名稱
          Copy-Item -Path $srcExe -Destination "TeamsMeetingRecorder.exe"
          Copy-Item -Path $srcExe -Destination "release_pkg/Teams會議錄音與轉文字.exe"
          Copy-Item -Path $srcExe -Destination "release_pkg/TeamsMeetingRecorder.exe"
          if (Test-Path "README.md") {
              Copy-Item -Path "README.md" -Destination "release_pkg/README.md"
          }
          if (Test-Path "config.json.example") {
              Copy-Item -Path "config.json.example" -Destination "release_pkg/config.json.example"
          }

          # 建立 ZIP 壓縮包 (英數檔名確保跨平台與瀏覽器下載相容)
          $zipName = "TeamsMeetingRecorder_${tag}_Windows_x64.zip"
          Compress-Archive -Path "release_pkg/*" -DestinationPath $zipName -Force

          # 計算 SHA256 驗證雜湊碼
          $hash = Get-FileHash -Path "TeamsMeetingRecorder.exe" -Algorithm SHA256
          "$($hash.Hash)  TeamsMeetingRecorder.exe" | Out-File -FilePath "TeamsMeetingRecorder.exe.sha256" -Encoding ascii

          Write-Host "Packaging completed successfully!"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: Teams 會議錄音與轉文字 ${{ steps.get_tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            TeamsMeetingRecorder.exe
            TeamsMeetingRecorder_*_Windows_x64.zip
            TeamsMeetingRecorder.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
